# =====================================
spring.datasource.url=jdbc:mysql://localhost:3306/sport_team_manager_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sport_team_user
spring.datasource.password=${DB_PASSWORD:$iutinfo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

